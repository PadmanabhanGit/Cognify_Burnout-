<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <defs>
    <style>
      .header { fill: #1565C0; }
      .layer-box { fill: #E3F2FD; stroke: #1565C0; stroke-width: 2; }
      .component { fill: #B3E5FC; stroke: #0277BD; stroke-width: 2; }
      .db { fill: #C8E6C9; stroke: #388E3C; stroke-width: 2; }
      .ml { fill: #FFE0B2; stroke: #D84315; stroke-width: 2; }
      .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
      .text { font-family: Arial; font-size: 12px; }
      .title { font-size: 28px; font-weight: bold; fill: #1565C0; }
      .section { font-size: 14px; font-weight: bold; fill: #0D47A1; }
      .item { font-size: 11px; fill: #333; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- Title -->
  <rect x="0" y="0" width="1400" height="50" class="header"/>
  <text x="700" y="32" text-anchor="middle" class="title" fill="white">BurnOut Tracker - Complete System Architecture</text>

  <!-- ===== CLIENT LAYER ===== -->
  <text x="50" y="90" class="section">📱 ANDROID CLIENT (Kotlin + Jetpack Compose)</text>

  <rect x="50" y="110" width="280" height="140" class="layer-box" rx="5"/>
  <text x="190" y="135" text-anchor="middle" style="font-weight: bold; font-size: 13px;">User Interface</text>
  <text x="65" y="155" class="item">• 23 Screens (Auth, Dashboard, Mood, Sleep, Study)</text>
  <text x="65" y="172" class="item">• Material Design 3 + Compose</text>
  <text x="65" y="189" class="item">• Navigation & State Management</text>
  <text x="65" y="206" class="item">• Real-time UI updates (Flow/StateFlow)</text>
  <text x="65" y="223" class="item">• Theme & Animations</text>

  <rect x="350" y="110" width="280" height="140" class="layer-box" rx="5"/>
  <text x="490" y="135" text-anchor="middle" style="font-weight: bold; font-size: 13px;">Services & Background Tasks</text>
  <text x="365" y="155" class="item">• AppMonitoringService (UsageStats)</text>
  <text x="365" y="172" class="item">• WorkManager (Background sync)</text>
  <text x="365" y="189" class="item">• Health Connect Integration</text>
  <text x="365" y="206" class="item">• Notifications & Alerts</text>
  <text x="365" y="223" class="item">• Local caching (Room DB)</text>

  <rect x="650" y="110" width="280" height="140" class="ml" rx="5"/>
  <text x="790" y="135" text-anchor="middle" style="font-weight: bold; font-size: 13px;">🤖 ML Engine</text>
  <text x="665" y="155" class="item">• TensorFlow Lite v2.14.0</text>
  <text x="665" y="172" class="item">• app_classifier.tflite model</text>
  <text x="665" y="189" class="item">• On-device app categorization</text>
  <text x="665" y="206" class="item">• Real-time inference</text>
  <text x="665" y="223" class="item">• No network required</text>

  <rect x="950" y="110" width="400" height="140" class="layer-box" rx="5"/>
  <text x="1150" y="135" text-anchor="middle" style="font-weight: bold; font-size: 13px;">Local Data & Storage</text>
  <text x="965" y="155" class="item">• Room Database (SQLite local cache)</text>
  <text x="965" y="172" class="item">• SharedPreferences (JWT tokens, settings)</text>
  <text x="965" y="189" class="item">• Secure keystore (credentials)</text>
  <text x="965" y="206" class="item">• File-based caching</text>
  <text x="965" y="223" class="item">• Offline capability support</text>

  <!-- Arrow down -->
  <path d="M 700 250 L 700 300" class="arrow"/>
  <text x="720" y="275" class="item">HTTPS REST API + JWT Auth</text>

  <!-- ===== API LAYER ===== -->
  <text x="50" y="330" class="section">🖥️ EXPRESS.JS BACKEND SERVER (Port 5000)</text>

  <rect x="50" y="350" width="320" height="160" class="component" rx="5"/>
  <text x="210" y="375" text-anchor="middle" style="font-weight: bold; font-size: 13px;">API Routes (9+ Endpoints)</text>
  <text x="65" y="395" class="item">• POST /auth/register, /login</text>
  <text x="65" y="412" class="item">• GET/POST /sleep-mood/log</text>
  <text x="65" y="429" class="item">• GET/POST /study/sessions</text>
  <text x="65" y="446" class="item">• POST /usage/log</text>
  <text x="65" y="463" class="item">• GET /burnout/compute (ML)</text>
  <text x="65" y="480" class="item">• GET /dashboard, /reports</text>
  <text x="65" y="497" class="item">• GET /activity/sync</text>

  <rect x="390" y="350" width="320" height="160" class="component" rx="5"/>
  <text x="550" y="375" text-anchor="middle" style="font-weight: bold; font-size: 13px;">Middleware & Security</text>
  <text x="405" y="395" class="item">• CORS handling</text>
  <text x="405" y="412" class="item">• JWT verification (HS256)</text>
  <text x="405" y="429" class="item">• Request logging</text>
  <text x="405" y="446" class="item">• Error handling</text>
  <text x="405" y="463" class="item">• Input validation</text>
  <text x="405" y="480" class="item">• Rate limiting (future)</text>
  <text x="405" y="497" class="item">• TLS 1.3 encryption</text>

  <rect x="730" y="350" width="320" height="160" class="component" rx="5"/>
  <text x="890" y="375" text-anchor="middle" style="font-weight: bold; font-size: 13px;">Business Logic & ML</text>
  <text x="745" y="395" class="item">• User authentication</text>
  <text x="745" y="412" class="item">• Data aggregation</text>
  <text x="745" y="429" class="item">🔴 Burnout Risk Calculation:</text>
  <text x="745" y="446" class="item">  Score = Sleep(0.25) + Activity(0.20)</text>
  <text x="745" y="463" class="item">  + CognitiveLoad(0.25) + Mood(0.30)</text>
  <text x="745" y="480" class="item">• Risk Level: Low/Moderate/High/Critical</text>
  <text x="745" y="497" class="item">• Generate recommendations</text>

  <rect x="1070" y="350" width="280" height="160" class="component" rx="5"/>
  <text x="1210" y="375" text-anchor="middle" style="font-weight: bold; font-size: 13px;">Response Processing</text>
  <text x="1085" y="395" class="item">• JSON serialization</text>
  <text x="1085" y="412" class="item">• Pagination</text>
  <text x="1085" y="429" class="item">• Gzip compression</text>
  <text x="1085" y="446" class="item">• Cache headers</text>
  <text x="1085" y="463" class="item">• Status codes</text>
  <text x="1085" y="480" class="item">• Error messages</text>

  <!-- Arrow down -->
  <path d="M 700 510 L 700 560" class="arrow"/>
  <text x="720" y="535" class="item">SQL Queries</text>

  <!-- ===== DATABASE LAYER ===== -->
  <text x="50" y="590" class="section">🗄️ SQLite Database (File-based, 10MB+ storage)</text>

  <g id="tables">
    <rect x="50" y="610" width="110" height="100" class="db" rx="3"/>
    <text x="105" y="630" text-anchor="middle" style="font-weight: bold;">users</text>
    <text x="60" y="650" class="item">id, email, password</text>
    <text x="60" y="665" class="item">fullName, created_at</text>
    <text x="60" y="680" class="item">(Primary Entity)</text>
    <text x="60" y="695" class="item" font-weight="bold">1:N Relations</text>

    <rect x="175" y="610" width="110" height="100" class="db" rx="3"/>
    <text x="230" y="630" text-anchor="middle" style="font-weight: bold;">sleep_mood_logs</text>
    <text x="185" y="650" class="item">userId (FK), date</text>
    <text x="185" y="665" class="item">sleepDuration, quality</text>
    <text x="185" y="680" class="item">mood, moodScore</text>

    <rect x="300" y="610" width="110" height="100" class="db" rx="3"/>
    <text x="355" y="630" text-anchor="middle" style="font-weight: bold;">app_usage</text>
    <text x="310" y="650" class="item">userId (FK), date</text>
    <text x="310" y="665" class="item">category, duration</text>
    <text x="310" y="680" class="item">Real-time tracking</text>

    <rect x="425" y="610" width="110" height="100" class="db" rx="3"/>
    <text x="480" y="630" text-anchor="middle" style="font-weight: bold;">physical_activity</text>
    <text x="435" y="650" class="item">userId (FK), date</text>
    <text x="435" y="665" class="item">steps, calories</text>
    <text x="435" y="680" class="item">activeMinutes</text>

    <rect x="550" y="610" width="110" height="100" class="db" rx="3"/>
    <text x="605" y="630" text-anchor="middle" style="font-weight: bold;">study_sessions</text>
    <text x="560" y="650" class="item">userId (FK)</text>
    <text x="560" y="665" class="item">subject, duration</text>
    <text x="560" y="680" class="item">startTime, endTime</text>

    <rect x="675" y="610" width="110" height="100" class="db" rx="3"/>
    <text x="730" y="630" text-anchor="middle" style="font-weight: bold;">productivity_logs</text>
    <text x="685" y="650" class="item">userId (FK), date</text>
    <text x="685" y="665" class="item">productivityScore</text>
    <text x="685" y="680" class="item">focusHours, tasks</text>

    <rect x="800" y="610" width="110" height="100" class="db" rx="3"/>
    <text x="855" y="630" text-anchor="middle" style="font-weight: bold;">burnout_assessments</text>
    <text x="810" y="650" class="item">userId (FK), date</text>
    <text x="810" y="665" class="item">riskScore (0-100)</text>
    <text x="810" y="680" class="item">riskLevel, warnings</text>

    <rect x="925" y="610" width="110" height="100" class="db" rx="3"/>
    <text x="980" y="630" text-anchor="middle" style="font-weight: bold;">auth_tokens</text>
    <text x="935" y="650" class="item">userId (FK)</text>
    <text x="935" y="665" class="item">tokenHash, expiresAt</text>
    <text x="935" y="680" class="item">isValid (boolean)</text>

    <rect x="1050" y="610" width="100" height="100" class="db" rx="3"/>
    <text x="1100" y="630" text-anchor="middle" style="font-weight: bold;">reports</text>
    <text x="1060" y="650" class="item">userId (FK), date</text>
    <text x="1060" y="665" class="item">type (weekly/monthly)</text>
    <text x="1060" y="680" class="item">data (JSON)</text>
  </g>

  <!-- ===== EXTERNAL INTEGRATIONS ===== -->
  <text x="50" y="790" class="section">🌐 EXTERNAL SYSTEMS & INTEGRATIONS</text>

  <rect x="50" y="810" width="150" height="70" class="component" rx="3" style="fill: #E0F2F1; stroke: #00796B;"/>
  <text x="125" y="835" text-anchor="middle" style="font-weight: bold; font-size: 11px;">Health APIs</text>
  <text x="60" y="855" class="item">• Samsung Health</text>
  <text x="60" y="870" class="item">• Google Fit</text>

  <rect x="220" y="810" width="150" height="70" class="component" rx="3" style="fill: #FFF9C4; stroke: #F57C00;"/>
  <text x="295" y="835" text-anchor="middle" style="font-weight: bold; font-size: 11px;">Cloud & Backup</text>
  <text x="230" y="855" class="item">• AWS S3 (backups)</text>
  <text x="230" y="870" class="item">• Daily @ 12 AM UTC</text>

  <rect x="390" y="810" width="150" height="70" class="component" rx="3" style="fill: #C8E6C9; stroke: #388E3C;"/>
  <text x="465" y="835" text-anchor="middle" style="font-weight: bold; font-size: 11px;">Monitoring</text>
  <text x="400" y="855" class="item">• PM2 Plus</text>
  <text x="400" y="870" class="item">• CloudWatch</text>

  <rect x="560" y="810" width="150" height="70" class="component" rx="3" style="fill: #FFE0B2; stroke: #D84315;"/>
  <text x="635" y="835" text-anchor="middle" style="font-weight: bold; font-size: 11px;">CI/CD Pipeline</text>
  <text x="570" y="855" class="item">• GitHub Actions</text>
  <text x="570" y="870" class="item">• Docker, Auto-deploy</text>

  <rect x="730" y="810" width="150" height="70" class="component" rx="3" style="fill: #F3E5F5; stroke: #6A1B9A;"/>
  <text x="805" y="835" text-anchor="middle" style="font-weight: bold; font-size: 11px;">PostgreSQL (Phase 2)</text>
  <text x="740" y="855" class="item">• For 1000+ users</text>
  <text x="740" y="870" class="item">• Master-slave replication</text>

  <rect x="900" y="810" width="150" height="70" class="component" rx="3" style="fill: #FFCCBC; stroke: #D84315;"/>
  <text x="975" y="835" text-anchor="middle" style="font-weight: bold; font-size: 11px;">TensorFlow Lite</text>
  <text x="910" y="855" class="item">• Model: app_classifier</text>
  <text x="910" y="870" class="item">• Version: 2.14.0</text>

  <rect x="1070" y="810" width="230" height="70" class="component" rx="3" style="fill: #ECEFF1; stroke: #546E7A;"/>
  <text x="1185" y="835" text-anchor="middle" style="font-weight: bold; font-size: 11px;">Future Integrations</text>
  <text x="1085" y="855" class="item">• Firebase, Segment, SendGrid</text>
  <text x="1085" y="870" class="item">• OAuth 2.0, 2FA, WebSocket sync</text>

</svg>
