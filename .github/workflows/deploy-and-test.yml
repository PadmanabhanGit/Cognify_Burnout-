name: Deploy to GitHub Pages & Run Selenium E2E

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (web-app)
        working-directory: ./web-app
        run: npm ci

      - name: Build web-app
        working-directory: ./web-app
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  selenium-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Selenium dependencies
        working-directory: ./tests/web
        run: npm ci

      - name: Run Selenium Tests
        working-directory: ./tests/web
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm test

      - name: Upload Selenium Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: |
            tests/web/Test Results/
